version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: musicapp_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: musicapp
      POSTGRES_PASSWORD: musicapp
      POSTGRES_DB: musicapp
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
